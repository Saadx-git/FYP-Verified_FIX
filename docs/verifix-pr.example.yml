# Copy to .github/workflows/verifix.yml in the repository you want to protect.
name: Verifix
on:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: <owner>/<verifix-repo>/.github/actions/verifix@main
        with:
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
